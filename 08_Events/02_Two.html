<html lang="en">
<head>

</head>
<body>

    <button id="stop">Stop</button>
</body>
<script>

    const sayHoney =  function(){
        console.log("Honey");   
    }
    setTimeout(sayHoney,2000)

    setTimeout(changeText, 2000)

        clearTimeout(changeMe)
        console.log("STOPPED");
    })

</script>
